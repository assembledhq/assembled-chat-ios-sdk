name: AssembledChatExample
options:
  bundleIdPrefix: com.assembled
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  AssembledChat:
    path: ..

targets:
  AssembledChatExample:
    type: application
    platform: iOS
    sources:
      - path: AssembledChatExample
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assembled.AssembledChatExample
        INFOPLIST_FILE: AssembledChatExample/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: AssembledChat

  OverlayRegressionHarness:
    type: application
    platform: iOS
    sources:
      - OverlayRegressionHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assembled.AssembledChatOverlayRegressionHarness
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Allows the test host to verify camera attachments."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Allows the test host to verify video attachments."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Allows the test host to verify photo attachments."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Allows the test host to verify photo attachments."
    dependencies:
      - package: AssembledChat

  OverlayRegressionHarnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OverlayRegressionHarnessUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assembled.AssembledChatOverlayRegressionHarnessUITests
        TEST_TARGET_NAME: OverlayRegressionHarness
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: OverlayRegressionHarness
